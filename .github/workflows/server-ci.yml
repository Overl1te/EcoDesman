name: Server CI

on:
  push:
    branches:
      - master
      - main
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
  workflow_dispatch:

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/overl1te/ecodesman-server
  DJANGO_SETTINGS_MODULE: config.settings.prod
  DJANGO_SECRET_KEY: ci-django-secret
  DJANGO_SERVE_MEDIA: "true"
  DJANGO_USE_S3_MEDIA: "false"

jobs:
  checks:
    name: Lint and Django checks
    runs-on: [self-hosted, Linux, local-server, ecodesman]
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements/base.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/base.txt ruff

      - name: Ruff lint
        run: ruff check .

      - name: Compile Python files
        run: python -m compileall -q apps config ops manage.py

      - name: Django system checks
        run: python manage.py check --settings=config.settings.prod

      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run

  container:
    name: Build and push GHCR image
    runs-on: [self-hosted, Linux, local-server, ecodesman]
    needs: checks
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build image
        run: |
          docker build \
            --tag "$IMAGE_NAME:${GITHUB_SHA}" \
            --tag "$IMAGE_NAME:latest" \
            ./server

      - name: Run image checks
        run: |
          set -euo pipefail
          docker run --rm \
            -e DJANGO_SETTINGS_MODULE="$DJANGO_SETTINGS_MODULE" \
            -e DJANGO_SECRET_KEY="$DJANGO_SECRET_KEY" \
            -e DJANGO_SERVE_MEDIA="$DJANGO_SERVE_MEDIA" \
            -e DJANGO_USE_S3_MEDIA="$DJANGO_USE_S3_MEDIA" \
            "$IMAGE_NAME:${GITHUB_SHA}" \
            python manage.py check --settings=config.settings.prod

          container_id=""
          cleanup() {
            if [ -n "$container_id" ]; then
              docker logs "$container_id" || true
              docker rm -f "$container_id" || true
            fi
          }
          trap cleanup EXIT

          container_id=$(docker run -d \
            -p 8000:8000 \
            -e DJANGO_SETTINGS_MODULE="$DJANGO_SETTINGS_MODULE" \
            -e DJANGO_SECRET_KEY="$DJANGO_SECRET_KEY" \
            -e DJANGO_SERVE_MEDIA="$DJANGO_SERVE_MEDIA" \
            -e DJANGO_USE_S3_MEDIA="$DJANGO_USE_S3_MEDIA" \
            "$IMAGE_NAME:${GITHUB_SHA}" \
            sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 1 --timeout 60")

          healthy=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health/ >/dev/null; then
              healthy=1
              break
            fi
            sleep 1
          done

          test "$healthy" = "1"
          docker logs "$container_id"
          docker rm -f "$container_id"
          container_id=""

      - name: Push image
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if docker push "$IMAGE_NAME:${GITHUB_SHA}" && docker push "$IMAGE_NAME:latest"; then
              exit 0
            fi
            echo "push failed (attempt $attempt), retrying..."
            sleep $((attempt * 3))
          done
          exit 1
