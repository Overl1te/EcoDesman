name: Mobile CI

on:
  push:
    branches:
      - master
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.38.7"
  JAVA_VERSION: "17"
  PRODUCTION_API_BASE_URL: "https://xn--b1apekb3anb5cpb.xn--p1ai/api/v1"
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

jobs:
  android:
    name: Analyze, test and build artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Point Flutter at Android SDK
        run: flutter config --android-sdk "$ANDROID_SDK_ROOT"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: >
          flutter build apk
          --release
          --dart-define=APP_ENV=production
          --dart-define=API_BASE_URL=${{ env.PRODUCTION_API_BASE_URL }}

      - name: Build release app bundle
        run: >
          flutter build appbundle
          --release
          --dart-define=APP_ENV=production
          --dart-define=API_BASE_URL=${{ env.PRODUCTION_API_BASE_URL }}

      - name: Record signing mode
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "release" > signing-mode.txt
          else
            echo "debug-fallback" > signing-mode.txt
            echo "::warning::ANDROID_KEYSTORE_* secrets are empty; artifacts will use debug signing."
          fi

      - name: Stage release artifacts
        run: |
          mkdir -p staging
          cp build/app/outputs/flutter-apk/app-release.apk staging/app-release.apk
          cp build/app/outputs/bundle/release/app-release.aab staging/app-release.aab
          cp signing-mode.txt staging/signing-mode.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EcoDesman-release
          path: mobile/staging
          if-no-files-found: error
