name: Mobile Release

on:
  push:
    branches:
      - master
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-release.yml"
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark GitHub Release as prerelease"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.38.7"
  JAVA_VERSION: "17"
  PRODUCTION_API_BASE_URL: "https://xn--b1apekb3anb5cpb.xn--p1ai/api/v1"
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

jobs:
  android-release:
    name: Build Android and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 40

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Point Flutter at Android SDK
        run: flutter config --android-sdk "$ANDROID_SDK_ROOT"

      - name: Read pubspec version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          full_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1 | tr -d '[:space:]"')"
          if [ -z "$full_version" ]; then
            echo "Could not read version from pubspec.yaml"
            exit 1
          fi

          app_version="${full_version%%+*}"
          build_number="${full_version#*+}"
          if [ "$app_version" = "$full_version" ]; then
            build_number="0"
          fi

          release_tag="v${full_version}"

          {
            echo "full=${full_version}"
            echo "app=${app_version}"
            echo "build=${build_number}"
            echo "tag=${release_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Record signing mode
        id: signing
        shell: bash
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "mode=debug-fallback" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_* secrets are empty; APK will use debug signing."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: >
          flutter build apk
          --release
          --dart-define=APP_ENV=production
          --dart-define=API_BASE_URL=${{ env.PRODUCTION_API_BASE_URL }}

      - name: Build release app bundle
        run: >
          flutter build appbundle
          --release
          --dart-define=APP_ENV=production
          --dart-define=API_BASE_URL=${{ env.PRODUCTION_API_BASE_URL }}

      - name: Prepare release assets
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          APP_VERSION: ${{ steps.version.outputs.app }}
          FULL_VERSION: ${{ steps.version.outputs.full }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          set -euo pipefail

          mkdir -p dist
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "dist/EcoDesman-${FULL_VERSION}.apk"
          cp mobile/build/app/outputs/bundle/release/app-release.aab "dist/EcoDesman-${FULL_VERSION}.aab"
          (cd dist && sha256sum * > "EcoDesman-${FULL_VERSION}-sha256.txt")

          signing_note="подписан release-ключом из GitHub Secrets."
          if [ "$SIGNING_MODE" != "release" ]; then
            signing_note="собран с debug-подписью: секреты ANDROID_KEYSTORE_* ещё не заданы. Для магазина нужен release keystore."
          fi

          {
            echo "## ЭкоВыхухоль ${APP_VERSION}"
            echo
            echo "Приложение ходит на https://эковыхухоль.рф/api/v1 (тот же домен, что и сайт)."
            echo
            echo "Что скачать:"
            echo
            echo "- APK — установка на Android напрямую;"
            echo "- AAB — пакет для магазина приложений."
            echo
            echo "Сборка ${signing_note}"
          } > release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          APP_VERSION: ${{ steps.version.outputs.app }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          PRERELEASE_INPUT: ${{ github.event.inputs.prerelease || 'false' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          flags=()
          if [ "$PRERELEASE_INPUT" = "true" ] || [ "$SIGNING_MODE" != "release" ]; then
            flags+=(--prerelease)
          else
            flags+=(--prerelease=false)
            flags+=(--latest)
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "ЭкоВыхухоль ${APP_VERSION}" \
              --notes-file release-notes.md \
              "${flags[@]}"
          else
            gh release create "$RELEASE_TAG" \
              --title "ЭкоВыхухоль ${APP_VERSION}" \
              --notes-file release-notes.md \
              --target "${GITHUB_SHA}" \
              "${flags[@]}"
          fi

          gh release upload "$RELEASE_TAG" dist/* --clobber
