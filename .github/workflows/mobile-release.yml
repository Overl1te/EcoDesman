name: Mobile Release

on:
  workflow_run:
    workflows:
      - "Mobile CI"
    types:
      - completed
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark GitHub Release as prerelease"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write
  actions: read

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

env:
  ARTIFACT_NAME: EcoDesman-release

jobs:
  android-release:
    name: Publish release from CI artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 40

      - name: Read pubspec version
        id: version
        shell: bash
        working-directory: mobile
        run: |
          set -euo pipefail

          full_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1 | tr -d '[:space:]"')"
          if [ -z "$full_version" ]; then
            echo "Could not read version from pubspec.yaml"
            exit 1
          fi

          app_version="${full_version%%+*}"
          build_number="${full_version#*+}"
          if [ "$app_version" = "$full_version" ]; then
            build_number="0"
          fi

          release_tag="v${full_version}"

          {
            echo "full=${full_version}"
            echo "app=${app_version}"
            echo "build=${build_number}"
            echo "tag=${release_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve CI run
        id: ci_run
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ -n "${WORKFLOW_RUN_ID:-}" ]; then
            run_id="$WORKFLOW_RUN_ID"
          else
            run_id="$(gh run list \
              --workflow "Mobile CI" \
              --branch "$BRANCH" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')"
            if [ -z "$run_id" ]; then
              echo "No successful Mobile CI run found on branch $BRANCH"
              exit 1
            fi
          fi

          echo "id=${run_id}" >> "$GITHUB_OUTPUT"

      - name: Download CI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ steps.ci_run.outputs.id }}
        run: |
          set -euo pipefail

          mkdir -p dist
          gh run download "$CI_RUN_ID" --name "$ARTIFACT_NAME" --dir dist
          find dist -type f

      - name: Read signing mode
        id: signing
        run: |
          mode="$(cat dist/signing-mode.txt)"
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"

      - name: Prepare release assets
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.app }}
          FULL_VERSION: ${{ steps.version.outputs.full }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          set -euo pipefail

          apk_path="$(find dist -type f -name 'app-release.apk')"
          aab_path="$(find dist -type f -name 'app-release.aab')"
          mv "$apk_path" "dist/EcoDesman-${FULL_VERSION}.apk"
          cp "dist/EcoDesman-${FULL_VERSION}.apk" "dist/EcoDesman-latest.apk"
          mv "$aab_path" "dist/EcoDesman-${FULL_VERSION}.aab"
          find dist -mindepth 1 -type d -empty -delete
          find dist -type f -name 'signing-mode.txt' -delete
          (cd dist && sha256sum * > "EcoDesman-${FULL_VERSION}-sha256.txt")

          signing_note="подписан release-ключом из GitHub Secrets."
          if [ "$SIGNING_MODE" != "release" ]; then
            signing_note="собран с debug-подписью: секреты ANDROID_KEYSTORE_* ещё не заданы. Для магазина нужен release keystore."
          fi

          {
            echo "## ЭкоВыхухоль ${APP_VERSION}"
            echo
            echo "Приложение ходит на https://эковыхухоль.рф/api/v1 (тот же домен, что и сайт)."
            echo
            echo "Что скачать:"
            echo
            echo "- APK — установка на Android напрямую;"
            echo "- AAB — пакет для магазина приложений."
            echo
            echo "Сборка ${signing_note}"
          } > release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          APP_VERSION: ${{ steps.version.outputs.app }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          PRERELEASE_INPUT: ${{ github.event.inputs.prerelease || 'false' }}
        run: |
          set -euo pipefail

          flags=()
          if [ "$PRERELEASE_INPUT" = "true" ] || [ "$SIGNING_MODE" != "release" ]; then
            flags+=(--prerelease)
          else
            flags+=(--prerelease=false)
            flags+=(--latest)
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "ЭкоВыхухоль ${APP_VERSION}" \
              --notes-file release-notes.md \
              "${flags[@]}"
          else
            gh release create "$RELEASE_TAG" \
              --title "ЭкоВыхухоль ${APP_VERSION}" \
              --notes-file release-notes.md \
              --target "${GITHUB_SHA}" \
              "${flags[@]}"
          fi

          gh release upload "$RELEASE_TAG" dist/* --clobber
