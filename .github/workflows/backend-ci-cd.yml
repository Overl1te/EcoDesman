name: Backend CI/CD

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: backend-cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/overl1te/ecodesman-server
  DJANGO_SETTINGS_MODULE: config.settings.prod
  DJANGO_SECRET_KEY: ci-django-secret
  DJANGO_SERVE_MEDIA: "true"

jobs:
  checks:
    name: Lint and Django checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/base.txt ruff

      - name: Ruff lint
        run: ruff check .

      - name: Compile Python files
        run: python -m compileall -q apps config ops manage.py

      - name: Django system checks
        run: python manage.py check --settings=config.settings.prod

      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run

  container:
    name: Build and smoke-run image
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build image
        run: |
          docker build \
            --tag "$IMAGE_NAME:${GITHUB_SHA}" \
            --tag "$IMAGE_NAME:latest" \
            .

      - name: Run image checks
        run: |
          set -euo pipefail
          docker run --rm \
            -e DJANGO_SETTINGS_MODULE="$DJANGO_SETTINGS_MODULE" \
            -e DJANGO_SECRET_KEY="$DJANGO_SECRET_KEY" \
            -e DJANGO_SERVE_MEDIA="$DJANGO_SERVE_MEDIA" \
            "$IMAGE_NAME:${GITHUB_SHA}" \
            python manage.py check --settings=config.settings.prod

          container_id=""
          cleanup() {
            if [ -n "$container_id" ]; then
              docker logs "$container_id" || true
              docker rm -f "$container_id" || true
            fi
          }
          trap cleanup EXIT

          container_id=$(docker run -d \
            -p 8000:8000 \
            -e DJANGO_SETTINGS_MODULE="$DJANGO_SETTINGS_MODULE" \
            -e DJANGO_SECRET_KEY="$DJANGO_SECRET_KEY" \
            -e DJANGO_SERVE_MEDIA="$DJANGO_SERVE_MEDIA" \
            "$IMAGE_NAME:${GITHUB_SHA}" \
            sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 1 --timeout 60")

          healthy=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health/ >/dev/null; then
              healthy=1
              break
            fi
            sleep 1
          done

          test "$healthy" = "1"
          docker logs "$container_id"
          docker rm -f "$container_id"
          container_id=""

      - name: Push image
        run: |
          docker push "$IMAGE_NAME:${GITHUB_SHA}"
          docker push "$IMAGE_NAME:latest"

  deploy:
    name: Deploy backend to VPS
    runs-on: ubuntu-latest
    needs: container
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare runtime config payloads
        id: runtime-config
        run: |
          {
            echo "compose_b64=$(base64 -w 0 compose.yaml)"
            echo "nginx_template_b64=$(base64 -w 0 deploy/nginx/default.conf.template)"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          BACKEND_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          COMPOSE_B64: ${{ steps.runtime-config.outputs.compose_b64 }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          NGINX_TEMPLATE_B64: ${{ steps.runtime-config.outputs.nginx_template_b64 }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          envs: BACKEND_IMAGE,COMPOSE_B64,GHCR_USER,GHCR_TOKEN,NGINX_TEMPLATE_B64,VPS_DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$VPS_DEPLOY_PATH"
            mkdir -p .deploy deploy/nginx
            (
              flock -w 300 9
              printf '%s' "$COMPOSE_B64" | base64 -d > compose.yaml
              printf '%s' "$NGINX_TEMPLATE_B64" | base64 -d > deploy/nginx/default.conf.template
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

              touch .env
              set_env() {
                key="$1"
                value="$2"
                if grep -q "^${key}=" .env; then
                  sed -i "s|^${key}=.*|${key}=${value}|" .env
                else
                  printf '%s=%s\n' "$key" "$value" >> .env
                fi
              }

              set_env BACKEND_IMAGE "$BACKEND_IMAGE"
              docker compose config >/dev/null
              docker compose pull web backup
              docker compose up -d --no-deps web backup
              docker compose up -d --no-deps proxy

              wait_for_http() {
                url="$1"
                name="$2"
                for _ in $(seq 1 60); do
                  if curl -fsS "$url" >/dev/null; then
                    return 0
                  fi
                  sleep 3
                done

                echo "Timed out waiting for $name: $url"
                docker compose ps || true
                docker compose logs --tail=200 proxy web frontend backup || true
                return 1
              }

              wait_for_http http://127.0.0.1/api/v1/health/ api
              wait_for_http http://127.0.0.1/ frontend
              docker compose ps db web backup proxy frontend
              docker image prune -af
            ) 9>.deploy/deploy.lock
