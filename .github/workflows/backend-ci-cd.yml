name: Backend CI/CD

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/overl1te/ecodesman-server
  DJANGO_SETTINGS_MODULE: config.settings.prod
  DJANGO_SECRET_KEY: ci-django-secret
  DJANGO_SERVE_MEDIA: "true"

jobs:
  checks:
    name: Lint and Django checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/base.txt ruff

      - name: Ruff lint
        run: ruff check .

      - name: Compile Python files
        run: python -m compileall -q apps config ops manage.py

      - name: Django system checks
        run: python manage.py check --settings=config.settings.prod

      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run

  container:
    name: Build and smoke-run image
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build image
        run: |
          docker build \
            --tag "$IMAGE_NAME:${GITHUB_SHA}" \
            --tag "$IMAGE_NAME:latest" \
            .

      - name: Run image checks
        run: |
          set -euo pipefail
          docker run --rm \
            -e DJANGO_SETTINGS_MODULE="$DJANGO_SETTINGS_MODULE" \
            -e DJANGO_SECRET_KEY="$DJANGO_SECRET_KEY" \
            -e DJANGO_SERVE_MEDIA="$DJANGO_SERVE_MEDIA" \
            "$IMAGE_NAME:${GITHUB_SHA}" \
            python manage.py check --settings=config.settings.prod

          container_id=""
          cleanup() {
            if [ -n "$container_id" ]; then
              docker logs "$container_id" || true
              docker rm -f "$container_id" || true
            fi
          }
          trap cleanup EXIT

          container_id=$(docker run -d \
            -p 8000:8000 \
            -e DJANGO_SETTINGS_MODULE="$DJANGO_SETTINGS_MODULE" \
            -e DJANGO_SECRET_KEY="$DJANGO_SECRET_KEY" \
            -e DJANGO_SERVE_MEDIA="$DJANGO_SERVE_MEDIA" \
            "$IMAGE_NAME:${GITHUB_SHA}" \
            sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 1 --timeout 60")

          healthy=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health/ >/dev/null; then
              healthy=1
              break
            fi
            sleep 1
          done

          test "$healthy" = "1"
          docker logs "$container_id"
          docker rm -f "$container_id"
          container_id=""

      - name: Push image
        run: |
          docker push "$IMAGE_NAME:${GITHUB_SHA}"
          docker push "$IMAGE_NAME:latest"

  deploy:
    name: Deploy backend to VPS
    runs-on: ubuntu-latest
    needs: container
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          BACKEND_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          envs: BACKEND_IMAGE,GHCR_USER,GHCR_TOKEN,VPS_DEPLOY_PATH
          script_stop: true
          script: |
            set -eu
            cd "$VPS_DEPLOY_PATH"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            touch .env
            set_env() {
              key="$1"
              value="$2"
              if grep -q "^${key}=" .env; then
                sed -i "s|^${key}=.*|${key}=${value}|" .env
              else
                printf '%s=%s\n' "$key" "$value" >> .env
              fi
            }

            set_env BACKEND_IMAGE "$BACKEND_IMAGE"
            docker compose pull web backup
            if docker compose pull frontend; then
              docker compose up -d --remove-orphans
            else
              docker compose up -d db web backup
            fi
            docker compose ps
            docker image prune -f
